<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic Collections</title>
<style>
  :root { --bg:#0b0f16; --panel:#141b26; --border:#232e3f; --text:#e8edf3;
          --dim:#8b98a8; --blue:#4da3ff; --green:#30d158; --red:#ff6b5e; }
  * { box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); margin:0;
         font-family:-apple-system,system-ui,"Segoe UI",sans-serif; }
  header { padding:22px 28px 6px; display:flex; align-items:baseline; gap:14px;
           flex-wrap:wrap; }
  header h1 { font-size:26px; margin:0; letter-spacing:-.3px; }
  .ver { font-size:12px; font-weight:700; color:var(--dim); background:#1a2230;
         padding:3px 10px; border-radius:10px; }
  .sub { color:var(--dim); font-size:14px; padding:0 28px 18px; }
  .sub button { margin-left:10px; }
  main { padding:0 28px 40px; }
  table { width:100%; border-collapse:collapse; background:var(--panel);
          border:1px solid var(--border); border-radius:14px; overflow:hidden; }
  th, td { padding:14px 16px; text-align:left; border-bottom:1px solid var(--border);
           vertical-align:middle; }
  th { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.6px;
       background:#10151f; }
  tr:last-child td { border-bottom:none; }
  tr:hover td { background:#171f2c; }
  .cname { font-size:16px; font-weight:700; }
  .thesis { color:var(--dim); font-size:13px; margin-top:2px; max-width:520px; }
  .count-btn { background:#1a2332; border:1px solid var(--border); color:var(--blue);
               font-size:16px; font-weight:800; padding:8px 18px; border-radius:10px;
               cursor:pointer; min-width:74px; }
  .count-btn:hover { border-color:var(--blue); }
  .removed-note { color:var(--red); font-size:11px; display:block; margin-top:3px; }
  .status { font-size:12px; font-weight:700; padding:5px 12px; border-radius:12px;
            text-transform:uppercase; letter-spacing:.4px; }
  .status.pending { background:rgba(255,190,60,.14); color:#ffbe3c; }
  .status.approved { background:rgba(48,209,88,.15); color:var(--green); }
  button.act { border:none; font-size:14px; font-weight:700; padding:9px 18px;
               border-radius:9px; cursor:pointer; }
  button.approve { background:var(--green); color:#04150a; }
  button.unapprove { background:#2a3542; color:var(--text); }
  button.rerun { background:#2a3542; color:var(--text); border:none; font-size:13px;
                 font-weight:700; padding:8px 14px; border-radius:8px; cursor:pointer; }
  /* detail view */
  .back { background:none; border:none; color:var(--blue); font-size:15px;
          font-weight:700; cursor:pointer; padding:0 0 14px; }
  .detail-head h2 { margin:0 0 4px; font-size:22px; }
  .detail-head .rule { color:var(--dim); font-size:13px; margin-bottom:18px; }
  .items { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
           gap:12px; }
  .item { display:flex; gap:12px; background:var(--panel); border:1px solid var(--border);
          border-radius:12px; padding:10px; align-items:flex-start; }
  .item img { width:54px; height:81px; object-fit:cover; border-radius:7px;
              background:#0d1219; flex:none; }
  .item .noimg { width:54px; height:81px; border-radius:7px; flex:none;
                 background:linear-gradient(135deg,#1d9bf0,#7b2ff7);
                 display:flex; align-items:center; justify-content:center;
                 font-weight:800; font-size:20px; }
  .item .meta { flex:1; min-width:0; }
  .item .t { font-weight:700; font-size:14px; line-height:1.3; }
  .item .s { color:var(--dim); font-size:12px; margin:3px 0; }
  .item .why { color:var(--blue); font-size:12px; }
  .item button.remove { background:rgba(255,107,94,.12); color:var(--red); border:none;
                        font-size:12px; font-weight:700; padding:7px 12px;
                        border-radius:8px; cursor:pointer; flex:none; }
  .item button.remove:hover { background:rgba(255,107,94,.25); }
  .removed-box { margin-top:26px; border:1px dashed var(--border); border-radius:12px;
                 padding:14px 16px; }
  .removed-box h3 { margin:0 0 10px; font-size:14px; color:var(--dim); }
  .removed-box .rrow { display:flex; justify-content:space-between; padding:5px 0;
                       font-size:13px; }
  .removed-box button { background:#2a3542; color:var(--text); border:none;
                        font-size:12px; font-weight:700; padding:5px 12px;
                        border-radius:7px; cursor:pointer; }
  .empty { color:var(--dim); padding:30px; text-align:center; }
  footer { color:var(--dim); font-size:12px; padding:0 28px 26px; }
</style>
</head>
<body>
<header>
  <h1>Agentic Collections</h1><span class="ver" id="ver"></span>
</header>
<div class="sub" id="sub"></div>
<main id="main"></main>
<footer>This product uses the TMDB API but is not endorsed or certified by TMDB.</footer>

<script>
const main = document.getElementById('main');
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const poster = p => p ? `https://image.tmdb.org/t/p/w185${p}` : '';

async function api(path, opts) {
  const r = await fetch(path, opts);
  return r.json();
}

async function showTable() {
  const data = await api('/api/collections');
  document.getElementById('ver').textContent = 'v' + data.version;
  document.getElementById('sub').innerHTML =
    `The master agent crawled <b>${data.catalog_size.toLocaleString()}</b> titles and built ` +
    `<b>${data.collections.length}</b> collections. Click an item count to review its titles.` +
    `<button class="rerun" onclick="rerunAgent()">Re-run master agent</button>`;
  const rows = data.collections.map(c => `
    <tr>
      <td>
        <div class="cname">${esc(c.name)}</div>
        <div class="thesis">${esc(c.thesis)}</div>
      </td>
      <td>
        <button class="count-btn" onclick="showDetail('${c.id}')">${c.total_items}</button>
        ${c.removed_count ? `<span class="removed-note">${c.removed_count} removed</span>` : ''}
      </td>
      <td><span class="status ${c.status}">${c.status}</span></td>
      <td>${c.status === 'approved'
            ? `<button class="act unapprove" onclick="setApprove('${c.id}', false)">Approved ✓</button>`
            : `<button class="act approve" onclick="setApprove('${c.id}', true)">Approve</button>`}
      </td>
    </tr>`).join('');
  main.innerHTML = `
    <table>
      <thead><tr>
        <th>Collection</th><th>Total # of Items</th><th>Status</th><th>Action</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

async function setApprove(id, on) {
  await api(`/api/collections/${id}/${on ? 'approve' : 'unapprove'}`, {method:'POST'});
  showTable();
}

async function rerunAgent() {
  document.getElementById('sub').textContent = 'Master agent is re-crawling the catalog…';
  await api('/api/agent/run', {method:'POST'});
  showTable();
}

async function showDetail(id) {
  const c = await api(`/api/collections/${id}`);
  const items = c.items.map(i => `
    <div class="item">
      ${i.poster_path
        ? `<img src="${poster(i.poster_path)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=\\'noimg\\'>${esc(i.title[0] || '?')}</div>'">`
        : `<div class="noimg">${esc((i.title || '?')[0])}</div>`}
      <div class="meta">
        <div class="t">${esc(i.title)}</div>
        <div class="s">${esc(i.media_type === 'tv' ? 'TV' : 'Movie')} · ${i.year ?? '—'} · ${esc(i.genres.join(', '))}</div>
        <div class="s">★ ${i.vote_average ? i.vote_average.toFixed(1) : '—'} (${(i.vote_count || 0).toLocaleString()} votes)</div>
        <div class="why">Agent: ${esc(i.why)}</div>
      </div>
      <button class="remove" onclick="removeItem('${c.id}', ${i.tmdb_id})">Remove</button>
    </div>`).join('');
  const removed = (c.removed_items || []).map(i => `
    <div class="rrow"><span>${esc(i.title)} (${i.year ?? '—'})</span>
      <button onclick="restoreItem('${c.id}', ${i.tmdb_id})">Restore</button></div>`).join('');
  main.innerHTML = `
    <button class="back" onclick="showTable()">← All collections</button>
    <div class="detail-head">
      <h2>${esc(c.name)} <span class="status ${c.status}">${c.status}</span></h2>
      <div class="rule">How the agent built it: ${esc(c.rule)}</div>
    </div>
    ${c.items.length ? `<div class="items">${items}</div>`
                      : `<div class="empty">No items left in this collection.</div>`}
    ${removed ? `<div class="removed-box"><h3>Removed by editorial</h3>${removed}</div>` : ''}`;
  window.scrollTo(0, 0);
}

async function removeItem(id, tmdbId) {
  await api(`/api/collections/${id}/remove`,
    {method:'POST', headers:{'Content-Type':'application/json'},
     body: JSON.stringify({tmdb_id: tmdbId})});
  showDetail(id);
}

async function restoreItem(id, tmdbId) {
  await api(`/api/collections/${id}/restore`,
    {method:'POST', headers:{'Content-Type':'application/json'},
     body: JSON.stringify({tmdb_id: tmdbId})});
  showDetail(id);
}

showTable();
</script>
</body>
</html>
